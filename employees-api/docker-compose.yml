services:
  postgres:
    image: postgres:15-alpine
    container_name: employees-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-employees_api_v2}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: employees-api
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      QUARKUS_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-employees_api_v2}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: