# Application configuration
quarkus.application.name=employees-api
quarkus.application.version=1.0.0

# HTTP server
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Database configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:employees_api_v2}}
quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.jdbc.url=${TEST_DATASOURCE_URL:jdbc:postgresql://localhost:5432/employees_api_v2}
%test.quarkus.datasource.devservices.enabled=${TEST_DB_DEV_SERVICES:true}

# Hibernate ORM
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# Flyway
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.migrate-at-start=true

# OpenAPI/Swagger
quarkus.swagger-ui.always-include=true
quarkus.http.cors=true

# Logging
quarkus.log.category."com.assessment".level=INFO